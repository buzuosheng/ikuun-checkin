name: 'kunkun Checkin Action'

on: 
  release:
    types: [published]
  push:
    tags:
    - 'v*'
  schedule:
    - cron: '0 16 * * *'
  watch:
    types: [started]
  workflow_dispatch:
   
jobs:
  checking:
    runs-on: ubuntu-latest
    env:
      DOMAIN: https://ikuuu.pw
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule'
    steps:
    - name: Setup timezone
      uses: zcong1993/setup-timezone@master
      with:
        timezone: Asia/Shanghai          
    - name: Get log
      uses: actions/checkout@master
      with:
        ref: main
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Playwright
      run: |
        npm install playwright-extra puppeteer-extra-plugin-stealth playwright
        npx playwright install chromium --with-deps
    - name: login in APi #登录获取cookie
      id: login
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        MAIL_USER: ${{ secrets.MAIL_USER }}
        MAIL_AUTH: ${{ secrets.MAIL_AUTH }}
      run: xvfb-run --auto-servernum node login.js
    - name: Chick in Api #签到
      env:
        SENDKEY: ${{ secrets.SENDKEY }}
      run: | 
        dateTime=`date +%Y-%m-%d\ %H:%M:%S`
        DOMAIN=$(head -n 1 domain.txt | tr -d '[:space:]')
        test -n "$DOMAIN"
        response=$(curl -b cookie.txt -X POST "$DOMAIN/user/checkin")
        curl -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" -d "title=${response}&desp=${response}" 
        echo "$dateTime - $(echo -e $response)" >> run.log
        tail run.log #避免日志上传失败丢失日志
    - name: Notify failure
      if: failure()
      env:
        SENDKEY: ${{ secrets.SENDKEY }}
      run: |
        curl -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
          -d "title=ikuuu签到失败&desp=自动签到没有完成。已尝试 domains.txt、旧站公告和 find@ikuuu.pro 的自动回复。请确认 MAIL_AUTH 仍有效，或把新的 https 地址加到 domains.txt 最上面。"
    - name: Commit #上传日志到仓库，可以自行修改 name 和 email
      id: commit
      if: always() && steps.login.outcome != 'skipped'
      env:
       NAME: ikuuu
       EMAIL: 1015350043@qq.com
      run: |
        git config --global user.name "$NAME"
        git config --global user.email "$EMAIL"
        git add domains.txt .github/workflows/main.yml run.log
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        msg="update log"
        if ! git diff --cached --name-only | grep -qx 'run.log'; then
          msg="更新域名"
        fi
        git commit -m "$msg"
        echo "changed=true" >> "$GITHUB_OUTPUT"
    - name: Push log
      if: steps.commit.outputs.changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.TOKEN }}
        branch: main
        pull: true
